<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- Root-absolute, NOT %sveltekit.assets%. SvelteKit 2 defaults
		     `paths.relative: true`, so %sveltekit.assets% emits a path relative to
		     the CURRENT route — and this app is client-rendered, so the shell is
		     served verbatim at every depth. On /projects/{id}/runs/{id} the browser
		     therefore requested /projects/{id}/favicon.svg and got a 404. Measured
		     live on 2026-08-17: three 404s in the console on every deep-linked
		     page, which is also enough to fail any "0 console errors" assertion.
		     This app is always served from the origin root (studio.nonagentic.ai). -->
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script src="%sveltekit.assets%/theme-init.js"></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
